# One set of services per machine: the container names and the published
# ports are fixed, so the project name is fixed too. Wherever the repository is
# checked out (a second clone, a git worktree), `docker compose` and the make
# targets address the same containers and volumes.
name: beauty-salon

services:
  # Reachable from this machine only: it starts with the user and the password
  # written below.
  postgres:
    image: postgres:18-alpine
    container_name: beauty-salon-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beauty_salon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - beauty-salon-network

  # Catches every mail the backend sends and shows it at http://localhost:8025;
  # nothing leaves the machine. Reachable from this machine only.
  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: beauty-salon-mail
    environment:
      # The backend always signs in to its SMTP server. Any credentials are
      # accepted here, over a connection without TLS.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    networks:
      - beauty-salon-network

  # Keeps the files of the attachments: an S3-compatible object storage
  # (SeaweedFS, all of it in one process). Reachable from this machine only,
  # at http://localhost:8333; the bucket is created when it starts.
  storage:
    image: chrislusf/seaweedfs:4.54
    container_name: beauty-salon-storage
    command: >
      mini -dir=/data
      -bucket=${STORAGE_BUCKET:-beauty-salon-dev}
      -master.telemetry=false
    environment:
      # The one identity the storage knows; it may do everything.
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-beauty-salon}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-beauty-salon-local-secret}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8333/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - beauty-salon-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: beauty-salon-backend
    env_file:
      - .env.localhost
    environment:
      # Override specific values for Docker networking
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-beauty_salon}
      SMTP_HOST: mailpit
      # The URLs given to a browser keep naming localhost (STORAGE_PUBLIC_ENDPOINT).
      STORAGE_ENDPOINT: http://storage:8333
    # Reachable from this machine only, like the database behind it
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - ./backend:/app/backend:cached
      - backend_node_modules:/app/backend/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      storage:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/system/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - beauty-salon-network
    command: pnpm --filter @beauty-salon-backend/server dev

  migration:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: beauty-salon-migration
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-beauty_salon}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beauty-salon-network
    # Keeps what is in the database: creates the schema when the database is
    # empty, otherwise applies the migrations that are missing, and loads the
    # sample data only into a database without data
    command: >
      sh -c "
      pnpm --filter @beauty-salon-backend/database run db:migrate &&
      pnpm --filter @beauty-salon-backend/database run db:seed --if-empty
      "

networks:
  beauty-salon-network:
    driver: bridge

volumes:
  postgres18_data:
  storage_data:
  backend_node_modules:
  pnpm_store:

packages:
  - backend/packages/*
  - backend/apps/*
  - frontend/packages/*
  - frontend/apps/*
  - shared-config
  - specs

# Dependency lifecycle scripts are denied unless listed as `true` here.
# Every package below ships prebuilt binaries (or only prints a banner), so
# none of them needs to run its install script.
allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  cpu-features: false
  esbuild: false
  msw: false
  oxc-resolver: false
  protobufjs: false
  ssh2: false

# drizzle-kit still depends on the deprecated @esbuild-kit loader, which pins an
# esbuild release with a known dev-server advisory. archiver (through
# testcontainers) and the Storybook docgen plugin depend on glob and minimatch
# releases with advisories that are fixed in glob 14.0.2 and minimatch 11.0.1.
overrides:
  esbuild@<=0.24.2: '>=0.25.0'
  glob@>=9.0.0 <14.0.2: '>=14.0.2'
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1'

permissions:
  taze:
    skills: false

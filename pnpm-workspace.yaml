packages:
  - backend/packages/*
  - backend/apps/*
  - frontend/packages/*
  - frontend/apps/*
  - shared-config
  - specs

# Dependency lifecycle scripts are denied unless listed as `true` here.
# Every package below ships prebuilt binaries (or only prints a banner), so
# none of them needs to run its install script.
allowBuilds:
  cpu-features: false
  esbuild: false
  oxc-resolver: false
  protobufjs: false
  ssh2: false

# drizzle-kit still depends on the deprecated @esbuild-kit loader, which pins an
# esbuild release with a known dev-server advisory. archiver (through
# testcontainers) and the Storybook docgen plugin depend on glob releases with
# advisories that are fixed in glob 14.0.2. The glob that replaces them depends
# on minimatch ^11.0.5, later than the release (11.0.1) that fixed the
# advisories of minimatch, so minimatch needs no entry of its own.
overrides:
  esbuild@<=0.24.2: '>=0.25.0'
  glob@>=9.0.0 <14.0.2: '>=14.0.6'

permissions:
  taze:
    skills: false

# picomatch <= 4.0.7 has a ReDoS advisory (GHSA-fc5q-39xc-vjpf) with no
# patched release. picomatch comes in only through development tools (vite,
# vitest, Storybook, knip, orval), which match globs
# written in this repository and never a pattern from a request; `pnpm audit
# --prod` finds nothing. Remove the entry once picomatch is patched (#226).
audit:
  ignore:
    - GHSA-fc5q-39xc-vjpf

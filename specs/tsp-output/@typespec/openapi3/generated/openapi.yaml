        - hairCondition
        - previousTreatments
        - medicalConditions
        - preferredProducts
        - avoidProducts
        - notes
      properties:
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: 対象顧客 ID。カルテをまだ持たない顧客を指定する
        allergies:
          type: array
          items:
            type: string
          nullable: true
          description: アレルギー情報 - アレルギーがない顧客の場合はnull
        scalpCondition:
          type: string
          nullable: true
          description: 頭皮状態 - 頭皮に問題がない健康な状態の場合はnull
        hairCondition:
          type: string
          nullable: true
          description: 毛髪状態 - 毛髪に特筆すべき問題がない場合はnull
        previousTreatments:
          type: array
          items:
            $ref: '#/components/schemas/Models.PreviousTreatment'
          nullable: true
          description: 過去施術の履歴 - 初回来店やケミカル施術経験がない顧客の場合はnull
        medicalConditions:
          type: string
          nullable: true
          description: 注意すべき体調・持病 - 健康上の問題がない顧客の場合はnull
        preferredProducts:
          type: array
          items:
            type: string
          nullable: true
          description: 好みの商材 - 特定の好みがない顧客の場合はnull
        avoidProducts:
          type: array
          items:
            type: string
          nullable: true
          description: 避けるべき商材 - 特に避けるべき商材がない顧客の場合はnull
        notes:
          type: string
          nullable: true
          description: その他メモ - 追加情報がない標準的なカルテの場合はnull
      description: カルテ新規作成リクエスト - 全項目のキーが必須。値がない項目は null を指定する。対応するテーブルはまだない
    Models.MedicalChartId:
      type: string
      format: uuid
      description: カルテ（メディカルチャート）を識別するブランド付きUUID。
    Models.MedicalChartResponse:
      type: object
      required:
        - id
        - customerId
        - allergies
        - scalpCondition
        - hairCondition
        - previousTreatments
        - medicalConditions
        - preferredProducts
        - avoidProducts
        - notes
        - lastUpdated
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Models.MedicalChartId'
          description: カルテ ID
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: 対象顧客 ID
        allergies:
          type: array
          items:
            type: string
          nullable: true
          description: アレルギー・敏感情報 - アレルギーがない顧客の場合はnull
        scalpCondition:
          type: string
          nullable: true
          description: 頭皮状態のメモ - 頭皮に問題がない健康な状態の場合はnull
        hairCondition:
          type: string
          nullable: true
          description: 毛髪状態のメモ - 毛髪に特筆すべき問題がない場合はnull
        previousTreatments:
          type: array
          items:
            $ref: '#/components/schemas/Models.PreviousTreatment'
          nullable: true
          description: 過去に実施したケミカル施術履歴 - 初回来店やケミカル施術経験がない顧客の場合はnull
        medicalConditions:
          type: string
          nullable: true
          description: 注意が必要な持病・体調情報 - 健康上の問題がない顧客の場合はnull
        preferredProducts:
          type: array
          items:
            type: string
          nullable: true
          description: 好みの商材・ブランド - 特定の好みがない顧客の場合はnull
        avoidProducts:
          type: array
          items:

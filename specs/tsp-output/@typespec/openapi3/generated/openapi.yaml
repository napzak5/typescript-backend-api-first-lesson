    Models.SessionId:
      type: string
      format: uuid
      description: ログインセッションを追跡するためのブランド付きUUID。
    Models.SessionResponse:
      type: object
      required:
        - id
        - userId
        - ipAddress
        - userAgent
        - expiresAt
        - refreshExpiresAt
        - lastActivityAt
        - createdAt
        - current
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Models.SessionId'
          description: セッションを一意に識別するID。
        userId:
          allOf:
            - $ref: '#/components/schemas/Models.UserId'
          description: セッション所有者のユーザーID。
        ipAddress:
          type: string
          nullable: true
          description: ログインしたときの接続元IPアドレス。取得できなかった場合はnull
        userAgent:
          type: string
          nullable: true
          description: ログインしたときの User-Agent ヘッダーの値。ヘッダーがなかった場合はnull
        expiresAt:
          type: string
          format: date-time
          description: 現在のアクセストークンの有効期限。発行から15分。
        refreshExpiresAt:
          type: string
          format: date-time
          description: セッションそのものの有効期限。ログイン時に決まり(通常は8時間後、rememberMe を指定した場合は30日後)、トークンを再発行しても延びない。この日時を過ぎると再発行できない。
        lastActivityAt:
          type: string
          format: date-time
          description: 最後にトークンを発行した(ログインまたは再発行した)日時。
        createdAt:
          type: string
          format: date-time
          description: セッション作成日時(ログインした日時)。
        current:
          type: boolean
          description: このリクエストを認証したセッションかどうか。DB のカラムではなく、リクエストごとに決まる。
      description: |-
        セッションレスポンス - sessions テーブルの公開カラムと、計算値 current を返す。
        トークンのハッシュは返さない。サーバーはトークンそのものを保存しないので、
        トークンは発行したログイン・トークン再発行のレスポンスでのみ返す。
        current 以外のプロパティ名と null 許可は DB カラムと一致させている。

  /api/v1/access-control/resource/{resource}/access:
    get:
      operationId: AccessControlCrud_listResourceAccess
      summary: List resource access
      description: 指定したリソース種別に対するユーザーごとのアクセス可否を、絞り込み条件とページネーションを指定して一覧取得します。権限が定義されていないリソース種別を指定した場合は404を返します。
      parameters:
        - name: resource
          in: path
          required: true
          description: 対象リソース種別
          schema:
            type: string
        - $ref: '#/components/parameters/Models.ResourceAccessSearchRequest.limit'
        - $ref: '#/components/parameters/Models.ResourceAccessSearchRequest.cursor'
        - $ref: '#/components/parameters/Models.ResourceAccessSearchRequest.action'
        - $ref: '#/components/parameters/Models.ResourceAccessSearchRequest.salonId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - links
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Models.ResourceAccessResponse'
                    description: 現在ページで取得したデータ配列。サロン一覧や予約履歴の実データを格納する。
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Models.PaginationMeta'
                    description: ページング状態を示すメタ情報。次ページの有無やカーソル値を含む。
                  links:
                    allOf:
                      - $ref: '#/components/schemas/Models.PaginationLinks'
                    description: 関連するページ遷移リンク。HATEOAS 連携や外部連携向けに利用する。
                description: |-
                  カーソル方式のページネーションレスポンスモデル。
                  `CursorPaginationParams` を受けたAPIが検索結果とページング状態をまとめて返却する際に利用する。

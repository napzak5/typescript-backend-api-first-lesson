        color: カラー - ヘアカラー、白髪染め、ハイライト等の染色技術
        perm: パーマ - コールドパーマ、デジタルパーマ等のウェーブ技術
        treatment: トリートメント - ダメージケア、栄養補給等の毛髪改善技術

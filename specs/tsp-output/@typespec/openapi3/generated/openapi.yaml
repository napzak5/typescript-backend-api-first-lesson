        - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - continueOnError
                - transactional
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/Models.CustomerCreateRequest"
                  minItems: 1
                  maxItems: 100
                  description: 処理対象となるアイテムの配列。1件以上100件以下に制限する。
                continueOnError:
                  type: boolean
                  description: 途中でエラーが発生しても処理を継続するかどうか。既定は false。
                  default: false
                transactional:
                  type: boolean
                  description: トランザクション内で一括処理を行うかどうか。既定は true。
                  default: true
              description: |-
                一括処理のリクエストモデル。

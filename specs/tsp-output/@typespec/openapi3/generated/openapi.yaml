        extension: エクステンション - ヘアエクステ、増毛等の毛髪追加技術
        nail: ネイル - マニキュア、ジェルネイル等の爪装飾技術
        eyelash: まつげ - まつげエクステ、まつげパーマ等のまつげ装飾技術

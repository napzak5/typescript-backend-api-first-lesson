          description: 確認時のメモ。メモがない場合はnull
      description: 在庫アラート確認リクエスト - 全項目のキーが必須
    Models.InventoryAlertResponse:
      type: object
      required:
        - itemId
        - threshold
        - currentStock
        - triggeredAt
        - inventoryId
        - alert
        - message
        - severity
        - acknowledged
        - acknowledgedBy
        - acknowledgedAt
      properties:
        itemId:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryId'
          description: 対象在庫 ID。inventoryId と同じ値
        threshold:
          type: number
          format: double
          description: アラートの判定に使った閾値
        currentStock:
          type: number
          format: double
          description: 警告発生時の在庫数
        triggeredAt:
          type: string
          format: date-time
          description: 警告が発生した日時
        inventoryId:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryId'
          description: 関連する在庫 ID
        alert:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryAlertType'
          description: アラート種別
        message:
          type: string
          description: 通知メッセージ
        severity:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryAlertSeverityType'
          description: 重要度レベル
        acknowledged:
          type: boolean
          description: 確認済みかどうか
        acknowledgedBy:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.StaffId'
          nullable: true
          description: 確認したスタッフ ID。未確認の場合はnull
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
          description: 確認日時。未確認の場合はnull
      description: 在庫に関するアラート情報
    Models.InventoryAlertSeverityType:
      type: string
      enum:
        - info
        - warning
        - critical
      description: |-
        アラート重要度区分 - 在庫アラートの重要度

        info: 情報 - 対応を急がない通知
        warning: 警告 - 早めの対応が必要な通知
        critical: 重大 - 直ちに対応が必要な通知
    Models.InventoryAlertSummaryResponse:
      type: object
      required:
        - totalAlerts
        - criticalAlerts
        - warningAlerts
        - infoAlerts
        - unacknowledged
      properties:
        totalAlerts:
          type: integer
          format: int32
          description: 有効なアラートの総数
        criticalAlerts:
          type: integer
          format: int32
          description: 重要度 critical のアラート数
        warningAlerts:
          type: integer
          format: int32
          description: 重要度 warning のアラート数
        infoAlerts:
          type: integer
          format: int32
          description: 重要度 info のアラート数
        unacknowledged:
          type: integer
          format: int32
          description: 未確認のアラート数
      description: 在庫アラートの件数の集計
    Models.InventoryAlertType:
      type: string
      enum:
        - low_stock
        - expiring
        - expired
        - overstock
      description: |-
        在庫アラート種別区分 - 在庫に対して発生するアラートの種類

        low_stock: 在庫僅少 - 在庫数が閾値を下回った状態
        expiring: 期限間近 - 使用期限が近づいている状態
        expired: 期限切れ - 使用期限を過ぎた状態
        overstock: 過剰在庫 - 在庫数が上限を超えた状態
    Models.InventoryCreateRequest:
      type: object
      required:
        - salonId
        - productId
        - lotNumber
        - expiryDate
        - location
        - shelf
        - notes
      properties:
        salonId:
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          description: 在庫を追加するサロン ID
        productId:
          allOf:
            - $ref: '#/components/schemas/Models.ProductId'
          description: 在庫の対象となる商品 ID。salonId のサロンの商品を指定する
        lotNumber:
          type: string
          nullable: true
          maxLength: 100
          description: ロット番号。同じサロン・商品の在庫の間で一意。ロット管理をしない場合はnull
        expiryDate:
          type: string
          format: date
          nullable: true
          description: 使用期限。期限のない場合はnull
        location:
          type: string
          nullable: true
          maxLength: 100
          description: サロン内の保管場所。未設定の場合はnull
        shelf:
          type: string
          nullable: true
          maxLength: 50
          description: 保管場所内の棚番号。未設定の場合はnull
        notes:
          type: string
          nullable: true
          description: 備考メモ。未設定の場合はnull
      description: |-
        在庫新規登録リクエスト - 全項目のキーが必須。DB で NULL 許可のカラムのみ null を指定できる。
        在庫数は0で登録され、入庫は在庫移動(movement)で記録する
    Models.InventoryId:
      type: string
      format: uuid
      description: 在庫アイテムや消耗品を識別するブランド付きUUID。
    Models.InventoryMovementRequest:
      type: object
      required:
        - inventoryId
        - transactionType
        - quantity
        - unitCost
        - referenceType
        - referenceId
        - reason
      properties:
        inventoryId:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryId'
          description: 対象在庫 ID
        transactionType:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryTransactionType'
          description: 在庫操作区分
        quantity:
          type: number
          format: double
          minimum: -99999999.99
          maximum: 99999999.99
          description: |-
            操作数量。在庫数の増減量で、入庫は正、出庫は負の値で指定する。0は指定できない。
            purchase は正、sale・use・disposal は負でなければならない
        unitCost:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: 単価(円)。未設定の場合はnull
        referenceType:
          type: string
          nullable: true
          maxLength: 50
          description: '関連する記録の種別 (例: purchase_order、treatment_record)。関連する記録がない場合はnull'
        referenceId:
          type: string
          nullable: true
          format: uuid
          description: 関連する外部参照 ID。referenceType の記録の ID。関連する記録がない場合はnull
        reason:
          type: string
          nullable: true
          description: 操作理由。未設定の場合はnull
      description: |-
        在庫移動記録リクエスト - 1件の在庫移動(inventory_transactions の行)を記録し、対象在庫の在庫数を増減する。
        全項目のキーが必須。salonId・productId・lotNumber・expiryDate は対象在庫から、
        balanceBefore・balanceAfter・totalCost はサーバーが設定する
    Models.InventoryResponse:
      type: object
      required:
        - id
        - salonId
        - productId
        - currentStock
        - availableStock
        - reservedStock
        - lotNumber
        - expiryDate
        - location
        - shelf
        - lastCountedAt
        - lastCountedBy
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryId'
          description: 在庫 ID
        salonId:
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          description: 在庫を管理するサロン ID
        productId:
          allOf:
            - $ref: '#/components/schemas/Models.ProductId'
          description: 在庫の対象となる商品 ID
        currentStock:
          type: number
          format: double
          description: 現在の在庫数量
        availableStock:
          type: number
          format: double
          description: 引当中の数量を除いた、利用できる在庫数量
        reservedStock:
          type: number
          format: double
          description: 引当済み(予約済み)の在庫数量
        lotNumber:
          type: string
          nullable: true
          description: ロット番号。ロット管理をしない場合はnull
        expiryDate:
          type: string
          format: date
          nullable: true
          description: 使用期限。期限のない場合はnull
        location:
          type: string
          nullable: true
          description: サロン内の保管場所。未設定の場合はnull
        shelf:
          type: string
          nullable: true
          description: 保管場所内の棚番号。未設定の場合はnull
        lastCountedAt:
          type: string
          format: date-time
          nullable: true
          description: 最後に棚卸を行った日時。棚卸をしていない場合はnull
        lastCountedBy:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.StaffId'
          nullable: true
          description: 最後に棚卸を行ったスタッフ ID。棚卸をしていない場合はnull
        notes:
          type: string
          nullable: true
          description: 備考メモ。未設定の場合はnull
        createdAt:
          type: string
          format: date-time
          description: レコード作成日時
        updatedAt:
          type: string
          format: date-time
          description: レコード最終更新日時
      description: |-
        在庫レスポンス - inventory テーブルの全カラムを返す。1行はサロンにおける1商品(ロット)の在庫を表す。
        プロパティ名と null 許可は DB カラムと一致させている。
        在庫数(currentStock・availableStock・reservedStock)は在庫移動と棚卸によってのみ変わる
    Models.InventoryStockCountDiscrepancy:
      type: object
      required:
        - inventoryId
        - expected
        - counted
        - difference
      properties:
        inventoryId:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryId'
          description: 差異のあった在庫 ID
        expected:
          type: number
          format: double
          description: 棚卸前の在庫数量(currentStock)
        counted:
          type: number
          format: double
          description: 実際に数えた在庫数量
        difference:
          type: number
          format: double
          description: 差異(counted - expected)
      description: 棚卸で見つかった1件の在庫の差異
    Models.InventoryStockCountItem:
      type: object
      required:
        - inventoryId
        - countedQuantity
      properties:
        inventoryId:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryId'
          description: 棚卸した在庫 ID
        countedQuantity:
          type: number
          format: double
          minimum: 0
          maximum: 99999999.99
          description: 実際に数えた在庫数量
      description: 棚卸で数えた1件の在庫の数量
    Models.InventoryStockCountRequest:
      type: object
      required:
        - salonId
        - items
        - reason
      properties:
        salonId:
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          description: 棚卸を行うサロン ID
        items:
          type: array
          items:
            $ref: '#/components/schemas/Models.InventoryStockCountItem'
          minItems: 1
          maxItems: 500
          description: 棚卸した在庫の一覧。salonId のサロンの在庫を1件以上500件以下で、同じ在庫を重複せずに指定する
        reason:
          type: string
          nullable: true
          description: 棚卸の補足。差異を調整する在庫移動の reason に記録する。補足がない場合はnull
      description: |-
        棚卸リクエスト - 数えた在庫数量を登録する。全項目のキーが必須。
        すべての在庫を1つのトランザクションで処理し、1件でも処理できない場合はどの在庫も更新しない
    Models.InventoryStockCountResponse:
      type: object
      required:
        - adjustments
        - discrepancies
      properties:
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/Models.InventoryTransactionResponse'
          description: 差異を調整するために記録した在庫移動(transactionType が adjustment)の一覧。差異がない場合は空配列
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/Models.InventoryStockCountDiscrepancy'
          description: 差異のあった在庫の一覧。差異がない場合は空配列
      description: 棚卸の結果 - 記録した調整の在庫移動と、差異の一覧を返す
    Models.InventoryTransactionId:
      type: string
      format: uuid
      description: 在庫の入出庫(在庫移動)の記録を識別するブランド付きUUID。
    Models.InventoryTransactionResponse:
      type: object
      required:
        - id
        - salonId
        - productId
        - inventoryId
        - transactionType
        - quantity
        - balanceBefore
        - balanceAfter
        - unitCost
        - totalCost
        - referenceType
        - referenceId
        - lotNumber
        - expiryDate
        - reason
        - performedBy
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryTransactionId'
          description: 在庫移動 ID
        salonId:
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          description: 処理を行ったサロン ID
        productId:
          allOf:
            - $ref: '#/components/schemas/Models.ProductId'
          description: 対象の商品 ID
        inventoryId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.InventoryId'
          nullable: true
          description: 対象在庫 ID。対象の在庫が削除された場合はnull
        transactionType:
          allOf:
            - $ref: '#/components/schemas/Models.InventoryTransactionType'
          description: 在庫操作区分
        quantity:
          type: number
          format: double
          description: 操作した数量。在庫数の増減量で、入庫は正、出庫は負の値
        balanceBefore:
          type: number
          format: double
          description: 操作前の在庫数量
        balanceAfter:
          type: number
          format: double
          description: 操作後の在庫数量
        unitCost:
          type: integer
          format: int32
          nullable: true
          description: 単価(円)。未設定の場合はnull
        totalCost:
          type: integer
          format: int32
          nullable: true
          description: 金額(円)。unitCost と quantity の絶対値の積を四捨五入した値。単価が未設定の場合はnull
        referenceType:
          type: string
          nullable: true
          description: '関連する記録の種別 (例: purchase_order、treatment_record)。関連する記録がない場合はnull'
        referenceId:
          type: string
          nullable: true
          format: uuid
          description: 関連する外部参照 ID。referenceType の記録の ID。関連する記録がない場合はnull
        lotNumber:
          type: string
          nullable: true
          description: 操作時点の対象在庫のロット番号。ロット管理をしない場合はnull
        expiryDate:
          type: string
          format: date
          nullable: true
          description: 操作時点の対象在庫の使用期限。期限のない場合はnull
        reason:
          type: string
          nullable: true
          description: 操作理由。未設定の場合はnull
        performedBy:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.StaffId'
          nullable: true
          description: 操作を担当したスタッフ ID。未設定の場合はnull
        createdAt:
          type: string
          format: date-time
          description: 操作日時
      description: |-
        在庫移動レスポンス - inventory_transactions テーブルの全カラムを返す。1行は在庫数を増減させた1回の操作を表し、作成後は変更されない。
        プロパティ名と null 許可は DB カラムと一致させている
    Models.InventoryTransactionType:
      type: string
      enum:
        - purchase
        - sale
        - use
        - adjustment
        - return
        - disposal
        - transfer
      description: |-
        在庫移動種別区分 - 在庫数を増減させた操作の種類を表す区分

        purchase: 仕入 - 仕入先から商品を受け入れた入庫
        sale: 販売 - 顧客への店頭販売による出庫
        use: 施術使用 - 施術の材料として消費した出庫
        adjustment: 調整 - 棚卸差異や破損などの補正による増減
        return: 返品 - 仕入先への返品または顧客からの返品による増減
        disposal: 廃棄 - 期限切れや破損による廃棄
        transfer: 移動 - ほかの保管場所・店舗との間の移動による増減
    Models.InventoryUpdateRequest:
      type: object
      properties:
        lotNumber:
          type: string
          nullable: true
          maxLength: 100
          description: ロット番号。同じサロン・商品の在庫の間で一意。nullでクリア
        expiryDate:
          type: string
          format: date
          nullable: true
          description: 使用期限。nullでクリア
        location:
          type: string
          nullable: true
          maxLength: 100
          description: サロン内の保管場所。nullでクリア
        shelf:
          type: string
          nullable: true
          maxLength: 50
          description: 保管場所内の棚番号。nullでクリア
        notes:
          type: string
          nullable: true
          description: 備考メモ。nullでクリア
      description: |-
        在庫部分更新リクエスト - 指定した項目だけを更新する。DB で NULL 許可のカラムは null でクリアできる。
        在庫数は変更できない(在庫移動と棚卸で変更する)。サロンと商品も変更できない
    Models.InventoryValueReportCategory:
      type: object
      required:
        - category
        - value
        - itemCount
      properties:
        category:
          type: string
          nullable: true
          description: 商品カテゴリ。カテゴリ未設定の商品の集計の場合はnull
        value:
          type: number
          format: double
          description: カテゴリの在庫評価額(円)
        itemCount:
          type: integer
          format: int32
          description: カテゴリの在庫品目数
      description: 在庫評価額レポートのカテゴリ別の集計
    Models.InventoryValueReportResponse:
      type: object
      required:
        - totalValue
        - totalItems
        - categories
      properties:
        totalValue:
          type: number
          format: double
          description: 在庫評価額の合計(円)
        totalItems:
          type: integer
          format: int32
          description: 集計した在庫品目数
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Models.InventoryValueReportCategory'
          description: カテゴリ別の集計
      description: |-
        在庫評価額レポート - 在庫数量に商品の仕入価格(purchasePrice)を掛けた評価額を集計する。
        仕入価格が未設定の商品は評価額0として数える
    Models.MedicalChartCreateRequest:

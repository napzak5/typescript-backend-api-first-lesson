security:
  - BearerAuth: []
components:
  parameters:
    Models.AttachmentDownloadUrlRequest:
      name: inline
      in: query
      required: false
      description: trueの場合はブラウザ内で表示するためのURLを、falseの場合は保存(ダウンロード)するためのURLを発行する
      schema:
        type: boolean
        default: false
      explode: false
    Models.AttachmentSearchRequest.cursor:
      name: cursor
      in: query
      required: false
      description: 取得開始位置を示すカーソル。前回レスポンスの `meta.nextCursor` を指定する
      schema:
        type: string
      explode: false
    Models.AttachmentSearchRequest.limit:
      name: limit
      in: query
      required: false
      description: 1ページあたりの取得件数上限 (1〜100)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      explode: false
    Models.AttachmentSearchRequest.salonId:
      name: salonId
      in: query
      required: false
      description: ファイルが紐づくサロンIDによる絞り込み(完全一致)。省略した場合はサロンで絞り込まない
      schema:
        $ref: '#/components/schemas/Models.SalonId'
      explode: false
    Models.AvailableSlotSearchRequest.cursor:
      name: cursor
      in: query
      required: false
      description: 取得開始位置を示すカーソル。前回レスポンスの `meta.nextCursor` を指定する
      schema:
        type: string
      explode: false
    Models.AvailableSlotSearchRequest.date:
      name: date
      in: query
      required: true
      description: 空き枠を探す日付
      schema:
        type: string
        format: date
      explode: false
    Models.AvailableSlotSearchRequest.duration:
      name: duration
      in: query
      required: false
      description: 必要な施術時間（分）。指定しない場合はサービスの施術時間を使う
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1440
      explode: false
    Models.AvailableSlotSearchRequest.limit:
      name: limit
      in: query
      required: false
      description: 1ページあたりの取得件数上限 (1〜100)
      schema:
        type: integer

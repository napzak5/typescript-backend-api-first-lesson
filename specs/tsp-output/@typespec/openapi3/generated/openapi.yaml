          description: 避けるべき商材 - 特に避けるべき商材がない顧客の場合はnull
        notes:
          type: string
          nullable: true
          description: 自由記述メモ - 追加情報がない標準的なカルテの場合はnull
        lastUpdated:
          type: string
          format: date-time
          description: 最終更新日時
        createdAt:
          type: string
          format: date-time
          description: レコード作成日時。
        createdBy:
          type: string
          nullable: true
          description: レコードを作成したユーザーID。システム自動作成または匿名作成の場合はnull
        updatedAt:
          type: string
          format: date-time
          description: レコード最終更新日時。
        updatedBy:
          type: string
          nullable: true
          description: レコードを最後に更新したユーザーID。システム自動更新または匿名更新の場合はnull
      description: カルテレスポンス - 顧客ごとのカルテ情報を返す。対応するテーブルはまだない
    Models.MedicalChartUpdateRequest:
      type: object
      properties:
        allergies:
          type: array
          items:
            type: string
          nullable: true
          description: アレルギー情報 - アレルギーがない顧客の場合はnull、null指定で値をリセット可能
        scalpCondition:
          type: string
          nullable: true
          description: 頭皮状態 - 頭皮に問題がない健康な状態の場合はnull、null指定で値をリセット可能
        hairCondition:
          type: string
          nullable: true
          description: 毛髪状態 - 毛髪に特筆すべき問題がない場合はnull、null指定で値をリセット可能
        previousTreatments:
          type: array
          items:
            $ref: '#/components/schemas/Models.PreviousTreatment'
          nullable: true
          description: 過去施術の履歴 - 初回来店やケミカル施術経験がない顧客の場合はnull、null指定で値をリセット可能
        medicalConditions:
          type: string
          nullable: true
          description: 注意すべき体調・持病 - 健康上の問題がない顧客の場合はnull、null指定で値をリセット可能
        preferredProducts:
          type: array
          items:
            type: string
          nullable: true
          description: 好みの商材 - 特定の好みがない顧客の場合はnull、null指定で値をリセット可能
        avoidProducts:
          type: array
          items:
            type: string
          nullable: true
          description: 避けるべき商材 - 特に避けるべき商材がない顧客の場合はnull、null指定で値をリセット可能
        notes:
          type: string
          nullable: true
          description: その他メモ - 追加情報がない標準的なカルテの場合はnull、null指定で値をリセット可能
      description: |-
        カルテ部分更新リクエスト - 指定した項目だけを更新する。null を指定した項目はクリアする。対応するテーブルはまだない。
        対象の顧客は変更できない
    Models.MembershipTierType:
      type: string
      enum:
        - regular
        - silver
        - gold
        - platinum
        - vip
      description: |-
        会員ランク区分 - 顧客の会員ランクを表し、特典・優待内容を決定する区分

        regular: 一般会員 - 基本ランク、標準的なサービスを提供
        silver: シルバー会員 - 中級ランク、5%の基本割引等の特典付与
        gold: ゴールド会員 - 上級ランク、10%の割引や優先予約等の特典付与
        platinum: プラチナ会員 - 最上級ランク、15%の割引や特別サービス提供
        vip: VIP会員 - 特別会員、完全カスタマイズされた特別待遇を提供
    Models.Money:
      type: object
      required:
        - value
        - currency
        - taxRate
      properties:
        value:
          type: integer
          format: int64
          description: 通貨の最小単位で表現した金額値。
        currency:
          allOf:
            - $ref: '#/components/schemas/Models.CurrencyCodeType'
          description: 使用する通貨コード。
        taxRate:
          type: number
          allOf:
            - $ref: '#/components/schemas/Models.decimal'
          nullable: true
          description: 適用税率。税率が適用されない場合はnull
      description: 税抜・税込計算に利用する金額モデル。
    Models.OpeningHours:
      type: object
      required:
        - dayOfWeek
        - date
        - openTime
        - closeTime
        - isHoliday
        - holidayName
        - notes
      properties:
        dayOfWeek:
          allOf:
            - $ref: '#/components/schemas/Models.DayOfWeekType'
          description: dateの曜日。dateと一致している必要がある
        date:
          type: string
          format: date
          description: 日付
        openTime:
          type: string
          nullable: true
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          description: 開店時刻。HH:mm:ss形式で返す（指定時はHH:mmも可）。終日休業の場合はnull
        closeTime:
          type: string
          nullable: true
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          description: 閉店時刻。HH:mm:ss形式で返す（指定時はHH:mmも可）。終日休業の場合はnull
        isHoliday:
          type: boolean
          description: 休業日かどうかを示すフラグ。
        holidayName:
          type: string
          nullable: true
          description: 祝日名称や社内呼称などの休業理由。通常営業日または理由不要の場合はnull
        notes:
          type: string
          nullable: true
          description: 備考や注意事項。特記事項がない場合はnull
      description: 特定の日付の営業時間（営業日カレンダーの1日分）を表すモデル。
    Models.OrderId:
      type: string
      format: uuid
      description: サプライヤー発注・仕入れオーダーを識別するブランド付きUUID。
    Models.OrderStatusType:
      type: string
      enum:
        - draft
        - pending
        - approved
        - ordered
        - shipped
        - delivered
        - cancelled
      description: |-
        発注ステータス区分 - 商品発注の進行状態を表す区分

        draft: 下書き - 発注内容を作成中の状態
        pending: 承認待ち - 発注内容が確定し、承認を待っている状態
        approved: 承認済み - 責任者により発注が承認された状態
        ordered: 発注済み - サプライヤーへ正式に発注が行われた状態
        shipped: 発送済み - サプライヤーから商品が発送された状態
        delivered: 配送完了 - 商品が到着し、受領が完了した状態
        cancelled: キャンセル - 発注が取り消された状態
    Models.PaginationLinks:
      type: object
      required:
        - self
        - first
        - last
        - next
        - prev
      properties:
        self:
          type: string
          description: 現在ページを指すリンク。
        first:
          type: string
          nullable: true
          description: 最初のページへのリンク。総件数が確定しない場合はnull
        last:
          type: string
          nullable: true
          description: 最後のページへのリンク。カーソル算出ができない場合はnull
        next:
          type: string
          nullable: true
          description: 次ページへのリンク。最終ページの場合はnull
        prev:
          type: string
          nullable: true
          description: 前ページへのリンク。初回ページまたは戻り操作が不要な場合はnull
      description: |-
        ページ遷移に利用するリンク情報モデル。
        API クライアントや外部連携がRESTフローで次・前のリソースを辿る際に利用する。
    Models.PaginationMeta:
      type: object
      required:
        - total
        - limit
        - hasMore
        - cursor
        - nextCursor
        - prevCursor
      properties:
        total:
          type: integer
          format: int32
          nullable: true
          description: 取得対象全体の総件数。件数計測ができない場合はnull
        limit:
          type: integer
          format: int32
          description: 1ページあたりの取得件数。クエリパラメータ `limit` と一致する。
        hasMore:
          type: boolean
          description: 次ページが存在するかを示すフラグ。無限スクロールの継続判定に使用。
        cursor:
          type: string
          nullable: true
          description: 現在ページのカーソル値。次リクエストで `cursor` に指定することで同位置から再開できる。初回ページの場合はnull
        nextCursor:
          type: string
          nullable: true
          description: 次ページを取得するためのカーソル値。最終ページの場合はnull
        prevCursor:
          type: string
          nullable: true
          description: 前ページへ戻るためのカーソル値。初回ページまたは戻り操作が不要な場合はnull
      description: |-
        ページネーションに関する統計情報モデル。
        総件数やカーソル位置を保持し、フロントエンドの続き取得や無限スクロールの制御に利用する。
    Models.PaymentId:
      type: string
      format: uuid
      description: 決済取引（売上に対する1回の支払い）を識別するブランド付きUUID。
    Models.PaymentMethodId:
      type: string
      format: uuid
      description: サロンが受け付ける支払い方法の設定を識別するブランド付きUUID。
    Models.PaymentMethodType:
      type: string
      enum:
        - cash
        - credit_card
        - debit_card
        - e_money
        - qr_payment
        - bank_transfer
        - point
      description: |-
        支払い方法区分 - サロンで利用可能な決済手段の種類

        cash: 現金 - 現金による支払い
        credit_card: クレジットカード - クレジットカードによる支払い
        debit_card: デビットカード - 銀行口座から直接引き落としのカード支払い
        e_money: 電子マネー - Suica、PASMO等の電子マネーによる支払い
        qr_payment: QRコード決済 - PayPay、LINE Pay等のQRコード決済
        bank_transfer: 銀行振込 - 銀行口座への振込による支払い
        point: ポイント - サロンのポイントを使用した支払い
    Models.PaymentRefundRequest:
      type: object
      required:
        - refundAmount
        - refundReason
      properties:
        refundAmount:
          type: integer
          format: int32
          minimum: 1
          description: 返金額。決済取引の amount 以下。amount と等しい場合は全額返金、少ない場合は部分返金になる
        refundReason:
          type: string
          nullable: true
          description: 返金理由。理由を記録しない場合はnull
      description: 決済取引の返金リクエスト - 返金額と理由を指定する。全項目のキーが必須
    Models.PaymentResponse:
      type: object
      required:
        - id
        - saleId
        - paymentMethodId
        - transactionNumber
        - amount
        - status
        - processorTransactionId
        - cardLastFour
        - cardBrand
        - errorCode
        - errorMessage
        - processedAt
        - failedAt
        - refundedAt
        - refundAmount
        - refundReason
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Models.PaymentId'
          description: 決済取引 ID
        saleId:
          allOf:
            - $ref: '#/components/schemas/Models.SaleId'
          description: 支払いの対象となる売上 ID
        paymentMethodId:
          allOf:
            - $ref: '#/components/schemas/Models.PaymentMethodId'
          description: 使用した支払い方法の ID
        transactionNumber:
          type: string
          description: 取引番号。システムが採番し、すべての決済取引の間で一意
        amount:
          type: integer
          format: int32
          description: 支払金額
        status:
          allOf:
            - $ref: '#/components/schemas/Models.PaymentStatusType'
          description: 決済の状態
        processorTransactionId:
          type: string
          nullable: true
          description: 決済代行会社の取引 ID。現金など決済代行会社を介さない支払いの場合、または決済代行会社が受け付けなかった場合はnull
        cardLastFour:
          type: string
          nullable: true
          description: カード番号の下4桁。カード以外の支払いの場合はnull
        cardBrand:
          type: string
          nullable: true
          description: カードブランド。カード以外の支払いの場合はnull
        errorCode:
          type: string
          nullable: true
          description: 決済が失敗したときのエラーコード。失敗していない場合はnull
        errorMessage:
          type: string
          nullable: true
          description: 決済が失敗したときのエラーメッセージ。失敗していない場合はnull
        processedAt:
          type: string
          format: date-time
          nullable: true
          description: 決済が完了した日時。完了していない場合はnull
        failedAt:
          type: string
          format: date-time
          nullable: true
          description: 決済が失敗した日時。失敗していない場合はnull
        refundedAt:
          type: string
          format: date-time
          nullable: true
          description: 返金した日時。返金していない場合はnull
        refundAmount:
          type: integer
          format: int32
          nullable: true
          description: 返金額。返金していない場合はnull
        refundReason:
          type: string
          nullable: true
          description: 返金理由。返金していない場合、または理由を記録していない場合はnull
        createdAt:
          type: string
          format: date-time
          description: レコード作成日時
        updatedAt:
          type: string
          format: date-time
          description: レコード最終更新日時
      description: |-
        決済取引レスポンス - payment_transactions テーブルの1行。売上に対する1回の支払いを表す。
        決済代行会社の応答(processorResponse)と構造の定まっていない metadata は返さない。
        プロパティ名と null 許可は DB カラムと一致させている
    Models.PaymentStatusType:
      type: string
      enum:
        - pending
        - processing
        - completed
        - failed
        - refunded
        - partial_refund
      description: |-
        支払いステータス区分 - 決済取引(payment_transactions.status)と売上(sales.paymentStatus)の支払いの進行状態を表す区分

        pending: 支払い待ち - 支払いが開始されたがまだ完了していない状態
        processing: 処理中 - 決済処理が進行中の状態
        completed: 完了 - 支払いが正常に完了した状態
        failed: 失敗 - 支払い処理が失敗した状態
        refunded: 返金済み - 全額返金が完了した状態
        partial_refund: 部分返金 - 一部金額の返金が完了した状態
    Models.PermissionCheckRequest:
      type: object
      required:
        - userId
        - permissions
        - salonId
      properties:
        userId:
          allOf:
            - $ref: '#/components/schemas/Models.UserId'
          description: 確認対象のユーザー ID
        permissions:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          description: 確認したい権限キー一覧。1件以上100件以下で指定する
        salonId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          nullable: true
          description: サロン単位の権限チェック時のサロン ID。システム全体の権限をチェックする場合はnull
      description: 複数権限の保有状況を確認するリクエスト - 全項目のキーが必須。サロン ID は null を指定できる
    Models.PermissionCheckResponse:
      type: object
      required:
        - userId
        - permissions
      properties:
        userId:
          allOf:
            - $ref: '#/components/schemas/Models.UserId'
          description: 確認対象のユーザー ID
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Models.PermissionStatusResponse'
          description: 各権限の判定結果一覧
      description: 権限チェックの結果 - 指定した権限キーごとの判定結果を返す
    Models.PermissionGroupResponse:
      type: object
      required:
        - resource
        - permissions
      properties:
        resource:
          type: string
          description: 対象リソース種別
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Models.PermissionResponse'
          description: このリソース種別に属する権限の一覧
      description: 権限グループレスポンス - 対象リソース種別ごとにまとめた権限の一覧を返す
    Models.PermissionId:
      type: string
      format: uuid
      description: アクセス許可や操作権限を識別するブランド付きUUID。
    Models.PermissionResponse:
      type: object
      required:
        - id
        - key
        - name
        - description
        - resource
        - action
        - scope
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Models.PermissionId'
          description: 権限 ID
        key:
          type: string
          description: '権限キー（例: booking.create）'
        name:
          type: string
          description: 権限の名称
        description:
          type: string
          nullable: true
          description: 権限の説明 - 自明な権限や説明不要な基本権限の場合はnull
        resource:
          type: string
          description: 対象リソース種別
        action:
          type: string
          description: 許可する操作区分
        scope:
          allOf:
            - $ref: '#/components/schemas/Models.PermissionScopeType'
          nullable: true
          description: 権限の適用範囲（own/salon/all） - 範囲指定が不要なグローバル権限の場合はnull
      description: 権限レスポンス - 操作権限の定義を返す。全項目のキーが必須で、未設定の項目は null で表す
    Models.PermissionScopeType:
      type: string
      enum:
        - own
        - salon
        - all
      description: |-
        権限適用範囲区分 - 権限が及ぶデータの範囲を表す

        own: 本人 - 操作するユーザー自身に関係するデータだけに適用される
        salon: サロン - 対象サロンのデータに適用される
        all: 全体 - すべてのサロンのデータに適用される
    Models.PermissionStatusResponse:
      type: object
      required:
        - permission
        - granted
        - source
      properties:
        permission:
          type: string
          description: 権限キー
        granted:
          type: boolean
          description: 権限が付与されているかどうか
        source:
          type: string
          nullable: true
          description: 権限を付与したロール情報 - 権限が付与されていない場合はnull
      description: 個別権限の判定結果 - 全項目のキーが必須で、該当しない項目は null で表す
    Models.PointAdjustRequest:
      type: object
      required:
        - customerId
        - points
        - description
        - referenceType
        - referenceId
      properties:
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: ポイントを調整する顧客の ID
        points:
          type: integer
          format: int32
          description: 調整するポイント数。増やす場合は正、減らす場合は負の値で、0 は指定できない。調整後の残高が負になる値は指定できない
        description:
          type: string
          nullable: true
          description: 調整の理由。未設定の場合はnull
        referenceType:
          type: string
          nullable: true
          maxLength: 50
          description: 調整のもとになった記録の種類(sale、booking など)。referenceId と同時に指定する。参照する記録がない場合はnull
        referenceId:
          type: string
          nullable: true
          format: uuid
          description: 調整のもとになった記録の ID。referenceType と同時に指定する。参照する記録がない場合はnull
      description: |-
        ポイント調整リクエスト - 種別 adjusted のポイント取引を登録する。全項目のキーが必須。
        DB で NULL 許可のカラムのみ null を指定できる。残高はシステムが計算する
    Models.PointBalanceResponse:
      type: object
      required:
        - customerId
        - balance
      properties:
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: 対象顧客の ID
        balance:
          type: integer
          format: int32
          description: 現在のポイント残高
      description: |-
        ポイント残高レスポンス - 顧客の最新のポイント取引(customer_points)の balance を返す。
        ポイント取引のない顧客の残高は 0
    Models.PointEarnRequest:
      type: object
      required:
        - customerId
        - points
        - description
        - referenceType
        - referenceId
        - expiryDate
      properties:
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: ポイントを付与する顧客の ID
        points:
          type: integer
          format: int32
          minimum: 1
          description: 付与するポイント数
        description:
          type: string
          nullable: true
          description: 付与の理由。未設定の場合はnull
        referenceType:
          type: string
          nullable: true
          maxLength: 50
          description: 付与のもとになった記録の種類(sale、booking など)。referenceId と同時に指定する。参照する記録がない場合はnull
        referenceId:
          type: string
          nullable: true
          format: uuid
          description: 付与のもとになった記録の ID。referenceType と同時に指定する。参照する記録がない場合はnull
        expiryDate:
          type: string
          format: date
          nullable: true
          description: 付与したポイントの有効期限。有効期限を設けない場合はnull
      description: |-
        ポイント付与リクエスト - 種別 earned のポイント取引を登録する。全項目のキーが必須。
        DB で NULL 許可のカラムのみ null を指定できる。残高はシステムが計算する
    Models.PointExpireRequest:
      type: object
      required:
        - customerId
        - processBefore
      properties:
        customerId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          nullable: true
          description: 対象顧客の ID。すべての顧客を処理する場合はnull
        processBefore:
          type: string
          format: date
          nullable: true
          description: この日付より前に有効期限を迎えたポイントを失効させる。null の場合は処理を実行した日
      description: ポイント失効処理リクエスト - 有効期限を過ぎたポイントを失効させる対象を指定する。全項目のキーが必須
    Models.PointExpireResponse:
      type: object
      required:
        - processedCount
        - totalPoints
      properties:
        processedCount:
          type: integer
          format: int32
          description: 登録した失効(expired)のポイント取引の件数
        totalPoints:
          type: integer
          format: int32
          description: 失効させたポイントの合計
      description: ポイント失効処理の結果
    Models.PointExpiringResponse:
      type: object
      required:
        - customerId
        - expiringPoints
        - expirationDate
        - transactions
      properties:
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: 対象顧客の ID
        expiringPoints:
          type: integer
          format: int32
          description: 期間内に失効する予定のポイント数の合計
        expirationDate:
          type: string
          format: date
          nullable: true
          description: 期間内で最も早い有効期限。失効予定のポイントがない場合はnull
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Models.PointTransactionResponse'
          description: 期間内に有効期限を迎える獲得ポイントの取引の一覧。expiryDate の昇順で並ぶ
      description: 失効予定ポイントの集計結果 - 有効期限が近い獲得ポイントの合計と、その取引の一覧
    Models.PointTransactionId:
      type: string
      format: uuid
      description: 顧客ポイントの加算・減算履歴を識別するブランド付きUUID。
    Models.PointTransactionResponse:
      type: object
      required:
        - id
        - customerId
        - transactionType
        - points
        - balance
        - description
        - referenceType
        - referenceId
        - expiryDate
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Models.PointTransactionId'
          description: ポイント取引 ID
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: 対象顧客の ID
        transactionType:
          allOf:
            - $ref: '#/components/schemas/Models.PointTransactionType'
          description: 取引の種別
        points:
          type: integer
          format: int32
          description: ポイントの変動量。獲得は正、利用・失効は負の値
        balance:
          type: integer
          format: int32
          description: この取引の後のポイント残高
        description:
          type: string
          nullable: true
          description: 取引内容の説明。未設定の場合はnull
        referenceType:
          type: string
          nullable: true
          description: 取引のもとになった記録の種類(sale、booking など)。参照する記録がない場合はnull
        referenceId:
          type: string
          nullable: true
          format: uuid
          description: 取引のもとになった記録の ID。参照する記録がない場合はnull
        expiryDate:
          type: string
          format: date
          nullable: true
          description: 獲得したポイントの有効期限。有効期限のない取引の場合はnull
        createdAt:
          type: string
          format: date-time
          description: 取引の発生日時
      description: |-
        ポイント取引レスポンス - customer_points テーブルの1行。顧客ポイントの1回の増減と、その後の残高を表す。
        プロパティ名と null 許可は DB カラムと一致させている
    Models.PointTransactionType:
      type: string
      enum:
        - earned
        - used
        - expired
        - adjusted
        - transferred
      description: |-
        ポイント取引種別区分 - 顧客ポイントの増減(customer_points の1行)の種類

        earned: 獲得 - 来店や購入などでポイントを付与した取引
        used: 利用 - 支払いなどでポイントを使用した取引
        expired: 失効 - 有効期限を過ぎたポイントを失効させた取引
        adjusted: 調整 - スタッフが手動でポイントを増減した取引
        transferred: 移行 - 別の顧客との間でポイントを移した取引
    Models.PointUseRequest:
      type: object
      required:
        - customerId
        - points
        - description
        - referenceType
        - referenceId
      properties:
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: ポイントを利用する顧客の ID
        points:
          type: integer
          format: int32
          minimum: 1
          description: 利用するポイント数。現在の残高以下
        description:
          type: string
          nullable: true
          description: 利用の理由。未設定の場合はnull
        referenceType:
          type: string
          nullable: true
          maxLength: 50
          description: 利用のもとになった記録の種類(sale など)。referenceId と同時に指定する。参照する記録がない場合はnull
        referenceId:
          type: string
          nullable: true
          format: uuid
          description: 利用のもとになった記録の ID。referenceType と同時に指定する。参照する記録がない場合はnull
      description: |-
        ポイント利用リクエスト - 種別 used のポイント取引を登録する。全項目のキーが必須。
        DB で NULL 許可のカラムのみ null を指定できる。残高はシステムが計算する
    Models.PreviousTreatment:
      type: object
      required:
        - treatment
        - date
        - salonName
        - notes
      properties:
        treatment:
          allOf:
            - $ref: '#/components/schemas/Models.TreatmentType'
          description: 施術タイプ
        date:
          type: string
          format: date-time
          description: 施術日
        salonName:
          type: string
          nullable: true
          description: 施術を受けたサロン名 - 自店での施術や不明な場合はnull
        notes:
          type: string
          nullable: true
          description: 施術に関するメモ - 特記事項がない通常の過去施術の場合はnull
      description: 過去施術の履歴。カルテに含める
    Models.PricingStrategyType:
      type: string
      enum:
        - fixed
        - variable
        - tiered
        - dynamic
        - consultation_based
      description: |-
        価格戦略タイプ区分 - サービスの価格設定方法を定義

        fixed: 固定価格 - 常に同じ価格で提供
        variable: 変動価格 - 髪の長さや量など施術内容に応じて価格が変わる
        tiered: 段階価格 - 条件によって価格が変わる段階制
        dynamic: 動的価格 - 需要や時間帯によって変動する価格
        consultation_based: 要相談 - カウンセリング後に価格を決定する
    Models.ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - errors
        - correlationId
        - timestamp
      properties:
        type:
          type: string
          description: エラー種別を特定するための URI。参照することで関連ドキュメントに誘導できる。
        title:
          type: string
          description: ユーザーに短く要点を伝えるエラー概要メッセージ。
        status:
          type: integer
          format: int32
          description: レスポンスに付与される HTTP ステータスコード。
        detail:
          type: string
          nullable: true
          description: 今回の発生状況に固有の詳細説明。サポート対応時の一次情報となる。詳細が不要な場合はnull
        instance:
          type: string
          nullable: true
          description: この事象を一意に識別するための URI。監査ログやダッシュボードと連携する。URIが不要な場合はnull
        code:
          allOf:
            - $ref: '#/components/schemas/Models.ErrorCodeType'
          description: システム全体で共有する機械判読可能なエラーコード。画面表示や分岐処理に使用する。
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Models.ValidationError'
          nullable: true
          description: フィールド単位の検証エラーなど、追加のエラー詳細情報一覧。検証エラーがない場合はnull
        correlationId:
          type: string
          nullable: true
          description: 障害調査や問い合わせで利用する相関 ID。リクエスト単位で一意。相関IDが不要な場合はnull
        timestamp:
          type: string
          format: date-time
          description: エラー発生日時 (UTC)。サーバーログの検索キーとして使用する。
      description: |-
        RFC 9457 (Problem Details for HTTP APIs) に準拠した標準エラーレスポンスモデル。
        美容サロン予約システム全体で一貫したエラー情報を提供し、顧客・スタッフ双方の操作ログと連携する。
    Models.ProductId:
      type: string
      format: uuid
      description: サロンで扱う商品（商品マスタ。店販品・施術用商材）を識別するブランド付きUUID。

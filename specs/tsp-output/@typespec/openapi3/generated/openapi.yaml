openapi: 3.0.0
info:
  title: Beauty Salon API
  description: Comprehensive REST API for managing beauty salon operations including salons, staff, services, customers, bookings, treatments, payments, inventory, and access control. Built with TypeSpec for type-safe API-first development.
  version: '2.0'
tags:
  - name: System
  - name: Authentication
  - name: Admin - Authentication
  - name: Salons
  - name: Staff
  - name: Services
  - name: Customers
  - name: Bookings
  - name: Reviews
  - name: Attachments
  - name: Share
  - name: Treatments
  - name: Medical Charts
  - name: Sales
  - name: Payments
  - name: Sales Reports
  - name: Points
  - name: Inventory
  - name: Purchase Orders
  - name: Inventory Alerts
  - name: Roles & Permissions
  - name: Permissions
  - name: User Roles
  - name: Access Control
paths:
  /api/system/alive:
    get:
      operationId: SystemOperations_alive
      summary: Check API liveness
      description: プロセスが生存しているかを判定するエンドポイントで、異常時は再起動判定に利用されます。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alive:
                    type: boolean
                    enum:
                      - true
                required:
                  - alive
      tags:
        - System
      security:
        - {}
  /api/system/health:
    get:
      operationId: SystemOperations_health
      summary: Check API health
      description: APIが正常稼働しているかを判定し、監視ツールやロードバランサーから参照します。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.HealthStatus'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.HealthStatus'
      tags:
        - System
      security:
        - {}
  /api/system/ready:
    get:
      operationId: SystemOperations_ready
      summary: Check API readiness
      description: Kubernetes等のオーケストレーターがトラフィック受信可否を判断するための準備完了チェックです。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.SystemReadyResponse'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.SystemReadyResponse'
      tags:
        - System
      security:
        - {}
  /api/v1/access-control/check:
    post:
      operationId: AccessControlCrud_check
      summary: Check user access
      description: ユーザーが指定したリソースに対する操作を実行できるかを判定します。userIdに存在しないユーザーを指定した場合は400を返します。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - links
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Models.AccessCheckResponse'
                    description: レスポンスの主体となるビジネスデータ。
                  meta:
                    type: object
                    allOf:
                      - $ref: '#/components/schemas/Models.ResponseMeta'
                    nullable: true
                    description: リクエスト識別子やバージョン情報など共通メタデータ。メタ情報が不要な場合はnull
                  links:
                    type: object
                    additionalProperties:
                      type: string
                    nullable: true
                    description: 関連リソースや次アクションへのリンク情報。リンクがない場合はnull
                description: |-
                  API 成功レスポンスの共通ラッパーモデル。
                  サロン検索や予約登録など多様なユースケースで応答形式を統一し、クライアント実装を簡潔に保つ。
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Models.ProblemDetails'
        '401':
          description: |-
            認証されていない (401)。アクセストークンがない、無効、または有効期限切れ。
            ログインとトークン再発行では、資格情報またはリフレッシュトークンが正しくない。
            WWW-Authenticate ヘッダーに Bearer のチャレンジを付ける (RFC 9110 15.5.2、RFC 6750 3)。
          headers:
            WWW-Authenticate:
              required: true
              description: Bearer のチャレンジ。アクセストークンが無効または期限切れの場合は error="invalid_token" を含む。
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Models.ProblemDetails'
        '403':
          description: 認証されているが、この操作を行う権限がない (403)。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Models.ProblemDetails'
        '413':
          description: リクエスト本文がサイズ上限を超えている (413)。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Models.ProblemDetails'
        '415':
          description: リクエスト本文が、オペレーションの受け付ける形式ではない (415)。JSON を受け取るオペレーションでは UTF-8 の JSON、ファイルのアップロードでは multipart/form-data だけを受け付ける。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Models.ProblemDetails'
        '429':
          description: |-
            リクエスト数の上限を超えたときのエラーレスポンス (429)。
            クライアントは Retry-After ヘッダーの秒数だけ待ってから再試行する。
          headers:
            Retry-After:
              required: true
              description: 再試行できるようになるまでの秒数。
              schema:
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Models.ProblemDetails'
        '500':
          description: サーバー内部のエラー (500)。原因はレスポンスに含めず、correlationId でサーバーのログと照合する。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Models.ProblemDetails'
      tags:
        - Access Control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.AccessCheckRequest'

          nullable: true
          description: アレルギー物質一覧。該当なしの場合はnull
        fragrances:
          type: array
          items:
            type: string
          nullable: true
          description: アレルギー香料一覧。該当なしの場合はnull
        metals:
          type: array
          items:
            type: string
          nullable: true
          description: アレルギー金属一覧。該当なしの場合はnull
        plants:
          type: array

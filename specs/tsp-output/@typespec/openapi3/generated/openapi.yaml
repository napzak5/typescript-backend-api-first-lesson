openapi: 3.0.0
info:
  title: Beauty Salon API
  description: Comprehensive REST API for managing beauty salon operations including salons, staff, services, customers, reservations, bookings, treatments, payments, inventory, and access control. Built with TypeSpec for type-safe API-first development.
  version: "2.0"
tags:
  - name: System
  - name: Authentication
  - name: Admin - Authentication
  - name: Salons
  - name: Staff
  - name: Services
  - name: Customers
  - name: Reservations
  - name: Bookings
  - name: Reviews
  - name: Attachments
  - name: Share
  - name: Treatments
  - name: Medical Charts
  - name: Payments
  - name: Sales Reports
  - name: Points
  - name: Inventory
  - name: Purchase Orders
  - name: Inventory Alerts
  - name: Roles & Permissions
  - name: Permissions
  - name: User Roles
  - name: Access Control
paths:
  /access-control/check:
    post:
      operationId: AccessControlOperations_checkAccess
      description: Check user access
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                      - data
                    properties:
                      status:
                        type: string
                        enum:
                          - success
                        description: 固定値success。成功結果であることを示す。
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Models.AccessResult"
                        description: 成功時に返却するドメインデータ。
                    description: 成功時のデータとステータスを保持するモデル。
                  - type: object
                    required:
                      - status
                      - error
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: 固定値error。エラー結果であることを示す。
                      error:
                        allOf:
                          - $ref: "#/components/schemas/Models.Error"
                        description: 失敗時に返却するエラー情報。
                    description: 失敗時のエラー情報とステータスを保持するモデル。
      tags:
        - Access Control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Models.AccessCheck"
  /access-control/check-permissions:
    post:
      operationId: AccessControlOperations_checkPermissions
      description: Check multiple permissions
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                      - data
                    properties:
                      status:
                        type: string
                        enum:
                          - success
                        description: 固定値success。成功結果であることを示す。
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Models.PermissionCheckResult"
                        description: 成功時に返却するドメインデータ。
                    description: 成功時のデータとステータスを保持するモデル。
                  - type: object
                    required:
                      - status
                      - error
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: 固定値error。エラー結果であることを示す。
                      error:
                        allOf:
                          - $ref: "#/components/schemas/Models.Error"
                        description: 失敗時に返却するエラー情報。
                    description: 失敗時のエラー情報とステータスを保持するモデル。
      tags:
        - Access Control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Models.PermissionCheckRequest"
  /access-control/resource/{resource}/access:
    get:
      operationId: AccessControlOperations_getResourceAccess
      description: Get resource access list
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: salonId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Models.SalonId"
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                      - data
                    properties:
                      status:
                        type: string
                        enum:
                          - success
                        description: 固定値success。成功結果であることを示す。
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: string
                            userName:
                              type: string
                            hasAccess:
                              type: boolean
                            grantedBy:
                              type: array
                              items:
                                type: string
                          required:
                            - userId
                            - hasAccess
                            - grantedBy
                        description: 成功時に返却するドメインデータ。
                    description: 成功時のデータとステータスを保持するモデル。
                  - type: object
                    required:
                      - status
                      - error
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: 固定値error。エラー結果であることを示す。
                      error:
                        allOf:
                          - $ref: "#/components/schemas/Models.Error"
                        description: 失敗時に返却するエラー情報。
                    description: 失敗時のエラー情報とステータスを保持するモデル。
      tags:
        - Access Control
  /access-control/user/{userId}/permissions:
    get:
      operationId: AccessControlOperations_getUserPermissions
      description: Get user effective permissions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: salonId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Models.SalonId"
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                      - data
                    properties:
                      status:
                        type: string
                        enum:
                          - success
                        description: 固定値success。成功結果であることを示す。
                      data:
                        type: object
                        properties:
                          userId:
                            type: string
                          permissions:
                            type: array
                            items:
                              type: string
                          roles:
                            type: array
                            items:
                              type: object
                              properties:
                                roleId:
                                  $ref: "#/components/schemas/Models.RoleId"
                                roleName:
                                  type: string
                                permissions:
                                  type: array
                                  items:
                                    type: string
                              required:
                                - roleId
                                - roleName
                                - permissions
                        required:
                          - userId
                          - permissions
                          - roles
                        description: 成功時に返却するドメインデータ。
                    description: 成功時のデータとステータスを保持するモデル。
                  - type: object
                    required:
                      - status
                      - error
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: 固定値error。エラー結果であることを示す。
                      error:
                        allOf:
                          - $ref: "#/components/schemas/Models.Error"
                        description: 失敗時に返却するエラー情報。
                    description: 失敗時のエラー情報とステータスを保持するモデル。
      tags:
        - Access Control
  /access-control/validate:
    post:
      operationId: AccessControlOperations_validatePermissions
      description: Validate role permissions
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required:
                      - status
                      - data
                    properties:
                      status:
                        type: string
                        enum:
                          - success
                        description: 固定値success。成功結果であることを示す。
                      data:
                        type: object
                        properties:
                          isValid:
                            type: boolean
                          missingPermissions:
                            type: array
                            items:
                              type: string
                          extraPermissions:
                            type: array
                            items:
                              type: string
                        required:
                          - isValid
                          - missingPermissions
                          - extraPermissions
                        description: 成功時に返却するドメインデータ。
                    description: 成功時のデータとステータスを保持するモデル。
                  - type: object
                    required:
                      - status
                      - error
                    properties:
                      status:
                        type: string
                        enum:
                          - error
                        description: 固定値error。エラー結果であることを示す。
                      error:
                        allOf:
                          - $ref: "#/components/schemas/Models.Error"
                        description: 失敗時に返却するエラー情報。
                    description: 失敗時のエラー情報とステータスを保持するモデル。
      tags:
        - Access Control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId:
                  $ref: "#/components/schemas/Models.RoleId"
                requiredPermissions:
                  type: array
                  items:
                    type: string
              required:
                - roleId
                - requiredPermissions
  /api/system/alive:
    get:
      operationId: SystemOperations_alive
      summary: Check API liveness
      description: プロセスが生存しているかを判定するエンドポイントで、異常時は再起動判定に利用されます。
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alive:
                    type: boolean
                    enum:
                      - true
                required:
                  - alive
      tags:
        - System
  /api/system/health:
    get:
      operationId: SystemOperations_health
      summary: Check API health
      description: APIが正常稼働しているかを判定し、監視ツールやロードバランサーから参照します。
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Models.HealthStatus"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Models.HealthStatus"
      tags:
        - System
  /api/system/ready:
    get:
      operationId: SystemOperations_ready
      summary: Check API readiness
      description: Kubernetes等のオーケストレーターがトラフィック受信可否を判断するための準備完了チェックです。
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Models.SystemReadyResponse"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Models.SystemReadyResponse"
      tags:
        - System
  /api/v1/admin/auth/trusted-ip/{userId}:
    post:
      operationId: AdminAuthOperations_addTrustedIp
      description: Add trusted IP address for a user
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Models.AuthSuccessResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
        "401":
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
        "403":
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
        "404":
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
      tags:
        - Admin - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ipAddress:
                  type: string
              required:
                - ipAddress
    delete:
      operationId: AdminAuthOperations_removeTrustedIp
      description: Remove trusted IP address for a user
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: ipAddress
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Models.AuthSuccessResponse"
        "401":
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
        "403":
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
        "404":
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
      tags:
        - Admin - Authentication
  /api/v1/admin/auth/unlock/{userId}:
    post:
      operationId: AdminAuthOperations_unlockAccount
      description: Unlock a locked user account
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Models.AuthSuccessResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
        "401":
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
        "403":
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
        "404":
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
      tags:
        - Admin - Authentication
  /api/v1/attachments:
    get:
      operationId: AttachmentOperations_list
      description: サロンまたは顧客単位で登録済みの添付ファイルを一覧し、施術履歴の確認や資料整理に活用します。
      parameters:
        - name: salonId
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.PaginatedAttachments"
                  - $ref: "#/components/schemas/Models.Error"
      tags:
        - Attachments
  /api/v1/attachments/share-links/{shareLinkId}:
    delete:
      operationId: AttachmentOperations_deleteShareLink
      description: 不要になった共有リンクを失効させ、アクセス制御を適切に保ちます。
      parameters:
        - name: shareLinkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
        "204":
          description: "There is no content to send for this request, but the headers may be useful. "
      tags:
        - Attachments
  /api/v1/attachments/upload:
    post:
      operationId: AttachmentOperations_uploadFile
      description: スタッフが管理画面からファイル本体を直接アップロードし、予約記録や顧客カルテに紐づけるための操作です。
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.Attachment"
                  - $ref: "#/components/schemas/Models.Error"
      tags:
        - Attachments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Models.AttachmentCreateRequest"
  /api/v1/attachments/upload-url:
    post:
      operationId: AttachmentOperations_getUploadUrl
      description: 顧客やスタッフがブラウザから直接クラウドストレージへアップロードできるよう、短時間だけ有効な署名付きURLを発行します。
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.AttachmentUploadUrlResponse"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
      tags:
        - Attachments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Models.AttachmentUploadUrlGetRequest"
  /api/v1/attachments/{attachmentId}:
    get:
      operationId: AttachmentOperations_get
      description: 指定した添付ファイルの詳細情報を取得し、プレビュー表示や関連予約の確認に用います。
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.Attachment"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
      tags:
        - Attachments
    delete:
      operationId: AttachmentOperations_delete
      description: 不要になった添付ファイルを削除し、ストレージ容量の最適化と情報漏えいリスクの低減を図ります。
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
        "204":
          description: "There is no content to send for this request, but the headers may be useful. "
      tags:
        - Attachments
  /api/v1/attachments/{attachmentId}/download-url:
    get:
      operationId: AttachmentOperations_getDownloadUrl
      description: 閲覧権限を持つ利用者がファイルを安全に取得できるよう、短時間有効なダウンロードURLを発行します。
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
        - name: inline
          in: query
          required: false
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.AttachmentDownloadUrlResponse"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
      tags:
        - Attachments
  /api/v1/attachments/{attachmentId}/share-links:
    post:
      operationId: AttachmentOperations_createShareLink
      description: 施術前後の写真や資料を外部パートナーや顧客と共有するためのリンクを発行します。必要に応じてパスワード保護も適用します。
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.ShareLink"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
      tags:
        - Attachments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Models.ShareLinkCreateRequest"
    get:
      operationId: AttachmentOperations_listShareLinks
      description: 対象ファイルに対して発行済みの共有リンクを一覧し、公開状況や有効期限の管理を行います。
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Models.ShareLink"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
                  - $ref: "#/components/schemas/Models.Error"
      tags:
        - Attachments
  /api/v1/auth/2fa/backup-codes:
    post:
      operationId: AuthOperations_generateBackupCodes
      description: Generate new backup codes for 2FA
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backupCodes:
                    type: array
                    items:
                      type: string
                required:
                  - backupCodes
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.ProblemDetails"
                  - $ref: "#/components/schemas/Models.ProblemDetails"
        "401":
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Models.AuthTwoFactorVerifyRequest"
  /api/v1/auth/2fa/disable:
    post:
      operationId: AuthOperations_disableTwoFactor
      description: Disable two-factor authentication
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Models.AuthSuccessResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Models.ProblemDetails"
                  - $ref: "#/components/schemas/Models.ProblemDetails"
                  - $ref: "#/components/schemas/Models.ProblemDetails"
        "401":
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Models.ProblemDetails"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Models.AuthTwoFactorDisableRequest"
  /api/v1/auth/2fa/enable:
    post:
      operationId: AuthOperations_enableTwoFactor
      description: Enable two-factor authentication

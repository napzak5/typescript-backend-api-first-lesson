  schemas:
    Models.AccessCheckRequest:
      type: object
      required:
        - userId
        - resource
        - action
        - salonId
        - resourceId
      properties:
        userId:
          allOf:
            - $ref: '#/components/schemas/Models.UserId'
          description: 権限を判定するユーザー ID
        resource:
          type: string
          minLength: 1
          description: 対象リソースの識別子
        action:
          type: string
          minLength: 1
          description: 実行したい操作区分
        salonId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          nullable: true
          description: サロン単位での権限チェック時のサロン ID - システム全体権限のチェック時はnull
        resourceId:
          type: string
          nullable: true
          description: リソース固有の ID - リソース種別全体への権限チェック時はnull
      description: |-
        アクセス権限の確認リクエスト - ユーザーがリソースに対する操作を実行できるかを判定する。
        全項目のキーが必須
    Models.AccessCheckResponse:
      type: object
      required:
        - allowed
        - reason
        - requiredPermissions
        - userPermissions
      properties:
        allowed:
          type: boolean
          description: 操作が許可されたかどうか
        reason:
          type: string
          nullable: true
          description: 拒否または許可の理由 - 理由説明不要な明白なケースの場合はnull
        requiredPermissions:
          type: array
          items:
            type: string
          nullable: true
          description: 必要な権限キー一覧 - 権限不要なパブリック操作の場合はnull
        userPermissions:
          type: array
          items:
            type: string
          nullable: true
          description: ユーザーが保有する権限キー一覧 - 未ログインや権限なしユーザーの場合はnull
      description: アクセス権限チェックの結果 - 全項目のキーが必須で、該当しない項目は null で表す
    Models.AllergySeverityType:
      type: string
      enum:
        - mild
        - moderate
        - severe
        - life_threatening
      description: |-
        アレルギー重篤度区分 - アレルギー反応の重篤度を表し、対応レベルを決定

        mild: 軽度 - 軽いかゆみや赤み程度、通常の施術で注意すれば対応可能
        moderate: 中等度 - 明確な皮膚反応、特別な配慮や代替品の使用が必要
        severe: 重度 - 激しい反応、特定の施術を避けるべきレベル
        life_threatening: 生命に関わる - アナフィラキシー等の危険があり、該当する商材・施術を一切使用できないレベル
    Models.AllergyType:
      type: string
      enum:
        - chemical
        - fragrance
        - metal
        - latex
        - plant
        - other
      description: |-
        アレルギータイプ区分 - 顧客が持つアレルギーの種類を分類、施術時の注意事項として使用

        chemical: 化学物質 - カラー剤、パーマ剤等の化学薬品に対するアレルギー
        fragrance: 香料 - 香水、シャンプー等の香料成分に対するアレルギー
        metal: 金属 - ヘアピン、ハサミ等の金属製品に対するアレルギー
        latex: ラテックス - 手袋等のゴム製品に対するアレルギー
        plant: 植物 - ヘナ、ハーブ等の植物由来成分に対するアレルギー
        other: その他 - 上記に分類されないアレルギー
    Models.AttachmentCreateRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: HTTPリクエストで送信されるファイル本体。
        filename:
          type: string
          description: アップロード時に指定されたファイル名。
        content:
          type: string
          description: ファイルのContent-Type。
        salonId:
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          description: ファイルを関連付けるサロンID。全社共通ファイルの場合は省略する(レスポンスのsalonIdはnullになる)。
        tags:
          type: string
          description: タグ情報を表すJSON文字列。タグを設定しない場合は省略する(レスポンスのtagsはnullになる)。
      required:
        - file
        - filename
        - content
    Models.AttachmentDownloadUrlResponse:
      type: object
      required:
        - downloadUrl
        - expiresAt
      properties:
        downloadUrl:
          type: string
          description: 一時的に有効なダウンロード用URL。
        expiresAt:
          type: string
          format: date-time
          description: 署名付きURLの有効期限。
      description: 添付ファイルをダウンロードするための署名付きURLを返すレスポンス。
    Models.AttachmentId:
      type: string
      format: uuid
      description: 添付ファイル・画像データを識別するブランド付きUUID。
    Models.AttachmentResponse:
      type: object
      required:
        - id
        - key
        - filename
        - content
        - size
        - uploadedBy
        - salonId
        - metadata
        - tags
        - uploadedAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Models.AttachmentId'
          description: 添付ファイルを一意に識別するID。UUID形式。
        key:
          type: string
          description: オブジェクトストレージでファイルを参照するための内部キー。
        filename:
          type: string
          description: 利用者がアップロードした元のファイル名。
        content:
          type: string
          description: ファイルのMIMEタイプ（Content-Type）。
        size:
          type: integer
          format: int32
          description: ファイルサイズ（バイト単位）。
        uploadedBy:
          allOf:
            - $ref: '#/components/schemas/Models.UserId'
          description: ファイルをアップロードしたユーザーID。
        salonId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          nullable: true
          description: ファイルが紐づくサロンID。全社共通ファイルやシステムファイルの場合はnull。
        metadata:
          type: object
          additionalProperties: {}
          nullable: true
          description: 必要に応じて付加情報を保持する任意メタデータ。追加情報が不要な場合はnull。
        tags:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: ラベリングや検索に利用するタグ情報のセット。タグ付けをしていない場合はnull。
        uploadedAt:
          type: string
          format: date-time
          description: ファイルがアップロードされた日時。
        updatedAt:
          type: string
          format: date-time
          description: ファイル情報が最後に更新された日時。
      description: |-
        添付ファイルレスポンス - サロンシステムで管理するアップロード済みファイルのメタ情報を返す。
        対応するテーブルはまだない。全項目のキーが必須で、値がない項目は null を返す
    Models.AttachmentUploadUrlRequest:
      type: object
      required:
        - filename
        - content
        - size
        - salonId
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: アップロード予定のファイル名。
        content:
          type: string
          minLength: 1
          maxLength: 255
          description: アップロード予定ファイルのContent-Type。
        size:
          type: integer
          format: int32
          minimum: 1
          description: アップロード予定ファイルのサイズ（バイト単位）。
        salonId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          nullable: true
          description: ファイルをひも付けるサロンID。全社共通ファイルの場合はnull。
      description: |-
        アップロード用署名付きURL発行リクエスト - 外部ストレージへ直接アップロードするための署名付きURLを要求する。
        全項目のキーが必須。null を指定できる項目は null を送る
    Models.AttachmentUploadUrlResponse:
      type: object
      required:
        - uploadUrl
        - key
        - expiresAt
      properties:
        uploadUrl:
          type: string
          description: 一時的に有効なアップロード用URL。
        key:
          type: string
          description: 生成されたストレージキー。アップロード完了後の識別に使用。
        expiresAt:
          type: string
          format: date-time
          description: 署名付きURLの有効期限。
      description: 署名付きアップロードURLと関連情報を返すレスポンス。
    Models.AuditInfo:
      type: object
      required:
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
      properties:
        createdAt:
          type: string
          format: date-time
          description: レコード作成日時。
        createdBy:
          type: string
          nullable: true
          description: レコードを作成したユーザーID。システム自動作成または匿名作成の場合はnull
        updatedAt:
          type: string
          format: date-time
          description: レコード最終更新日時。
        updatedBy:
          type: string
          nullable: true
          description: レコードを最後に更新したユーザーID。システム自動更新または匿名更新の場合はnull
      description: 作成・更新ユーザーとタイムスタンプを保持する共通監査情報。
    Models.AuthEmailVerificationConfirmRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: メールに記載された確認トークン。
      description: メールアドレス確認を完了させるリクエスト。
    Models.AuthEmailVerificationSendRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 255
          description: 確認メールの送信先となるアカウントのメールアドレス。
      description: |-
        メールアドレス確認メールの送信を要求するリクエスト。
        アカウントの有無やメールアドレスの確認状態にかかわらず同じ応答を返す
    Models.AuthLoginRequest:
      type: object
      required:
        - email
        - password
        - rememberMe
        - twoFactorCode
      properties:
        email:
          type: string
          maxLength: 255
          description: ログインに使用するメールアドレス。
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: |-
            ログイン用パスワード。128文字以下。
            最小文字数(15文字)はパスワードを設定するとき(登録・再設定・変更)に検証し、ログインでは検証しない
        rememberMe:
          type: boolean
          description: セッションを長く保つかどうか。false の場合はログインから8時間、true の場合は30日でセッションが切れる。
        twoFactorCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: 2要素認証が有効な場合に入力するワンタイムコード。認証アプリが生成したTOTPコード、またはバックアップコードを指定する。2要素認証が無効なアカウントではnull
      description: ログインリクエスト - 全項目のキーが必須。2要素認証が無効なアカウントでは twoFactorCode に null を指定する
    Models.AuthLoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - token
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: API呼び出しに利用するアクセストークン。Authorization ヘッダーに Bearer として指定する。ランダムに生成した不透明な値で、クライアントは内容を解釈しない
        refreshToken:
          type: string
          description: アクセストークン再発行に使用するリフレッシュトークン。不透明な値で、再発行に使用すると以後は使用できない
        token:
          type: string
          enum:
            - Bearer
          description: トークン種別。常にBearer。
        expiresIn:
          type: integer
          format: int32
          description: アクセストークンが有効な残り時間(秒)。通常は900(15分)で、セッションの有効期限が先に来る場合はそれまでの秒数。
        user:
          allOf:
            - $ref: '#/components/schemas/Models.UserResponse'
          description: ログインしたユーザーの情報。
      description: |-
        ログインレスポンス - ログインとトークン再発行で発行したトークンと、ユーザー情報を返す。
        トークンはこのレスポンスでのみ返し、ほかのレスポンスには含めない
    Models.AuthPasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          description: 本人確認のための現在パスワード。128文字以下。
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          description: 変更後の新しいパスワード。規則は登録時のパスワード(AuthRegisterRequest.password)と同じ。現在のパスワードと同じ値は指定できない
      description: ログイン中ユーザーがパスワードを変更するためのリクエスト。
    Models.AuthPasswordForgotRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 255
          description: 対象アカウントのメールアドレス。
      description: |-
        パスワード再設定メールの送信を要求するリクエスト。
        アカウントの有無にかかわらず同じ応答を返す
    Models.AuthPasswordResetConfirmRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: メールで受け取った再設定トークン。
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          description: 新しいパスワード。規則は登録時のパスワード(AuthRegisterRequest.password)と同じ
      description: パスワード再設定を確定するためのリクエスト。
    Models.AuthPasswordResetVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: メールで受け取った再設定トークン。
      description: パスワード再設定トークンが有効かどうかを確認するリクエスト。
    Models.AuthRegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 255
          description: 登録に使用するメールアドレス。大文字と小文字を区別せず、小文字で保存する
        password:
          type: string
          minLength: 15
          maxLength: 128
          description: |-
            設定するパスワード。15文字以上128文字以下(Unicode のコードポイントで数える)で、文字種の組み合わせは要求しない。NFC に正規化して扱う。
            推測されやすいパスワードは拒否する(rule は blocklisted): メールアドレスまたはその @ より前と同じもの、同じ文字や短い並びの繰り返し、連続した文字の並び、よく知られたパスワード。
            NIST SP 800-63B と OWASP Authentication Cheat Sheet に従い、パスワードが唯一の認証要素となる場合の最小長を15文字とし、64文字以上のパスワードも受け付ける
      description: |-
        新規ユーザー登録リクエスト - 全項目のキーが必須。
        登録したユーザーのロールは customer になる。ロールはリクエストで指定できない
    Models.AuthStaffInvitationAcceptRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: メールで受け取った招待トークン。
        password:
          type: string
          minLength: 15
          maxLength: 128
          description: 設定するパスワード。規則は登録時のパスワード(AuthRegisterRequest.password)と同じ
      description: スタッフへの招待を受け入れて、ログインアカウントを作るためのリクエスト。
    Models.AuthStaffInvitationVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: メールで受け取った招待トークン。
      description: スタッフへの招待のトークンが使えるかどうかを確認するリクエスト。
    Models.AuthTokenRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 255
          description: ログインまたは前回の再発行で受け取ったリフレッシュトークン。
      description: アクセストークンを再発行するためのリクエスト。
    Models.AuthTwoFactorBackupCodesRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: 認証アプリが生成したTOTPコード(6桁の数字)、またはバックアップコード。
      description: バックアップコードを再発行する際の確認リクエスト。
    Models.AuthTwoFactorBackupCodesResponse:
      type: object
      required:
        - backupCodes
      properties:
        backupCodes:
          type: array
          items:
            type: string
          description: 新しく発行した復旧用バックアップコード一覧(10個)。それまでのバックアップコードは使用できない。
      description: |-
        バックアップコード再発行のレスポンス。
        バックアップコードはこのレスポンスでのみ返し、ほかのレスポンスには含めない
    Models.AuthTwoFactorDisableRequest:
      type: object
      required:
        - password
        - code
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: 本人確認のための現在パスワード。128文字以下。
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: 認証アプリが生成したTOTPコード(6桁の数字)、またはバックアップコード。
      description: 2要素認証を無効化する際の確認リクエスト。
    Models.AuthTwoFactorEnableRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: 本人確認のための現在パスワード。128文字以下。
      description: 2要素認証を有効化する際の認証リクエスト。
    Models.AuthTwoFactorSetupResponse:
      type: object
      required:
        - qrCodeUrl
        - secret
        - backupCodes
      properties:
        qrCodeUrl:
          type: string
          description: 認証アプリに登録するための otpauth:// URI。QRコードにして表示する。シークレットを含む。
        secret:
          type: string
          description: 手動登録用のシークレットキー(Base32)。
        backupCodes:
          type: array
          items:
            type: string
          description: 復旧用バックアップコード一覧(10個)。認証アプリのコードの代わりに、それぞれ1回だけ使える。
      description: |-
        2要素認証の設定情報を返すレスポンス。
        シークレットとバックアップコードはこのレスポンスでのみ返し、ほかのレスポンスには含めない
    Models.AuthTwoFactorVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: 認証アプリが生成したTOTPコード(6桁の数字)。バックアップコードは指定できない。
      description: 2要素認証の設定を確定するリクエスト。
    Models.AvailableSlotCheckRequest:
      type: object
      required:
        - staffId
        - serviceId
        - startTime
      properties:
        staffId:
          allOf:
            - $ref: '#/components/schemas/Models.StaffId'
          description: 担当を希望するスタッフのID。パスのサロンのスタッフを指定する
        serviceId:
          allOf:
            - $ref: '#/components/schemas/Models.ServiceId'
          description: 予約したい施術メニューのID。パスのサロンのサービスを指定する
        startTime:
          type: string
          format: date-time
          description: 希望する施術開始日時 (UTC)
      description: 空き状況確認リクエスト - 希望する日時・スタッフ・施術メニューの組み合わせを受け取る。キーは必須
    Models.AvailableSlotCheckResponse:
      type: object
      required:
        - isAvailable
        - conflicts
      properties:
        isAvailable:
          type: boolean
          description: 予約可能かどうか
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Models.BookingId'
          description: 希望した時間帯に重なっている予約のID一覧。重なりがない場合は空配列
      description: 空き状況確認レスポンス - 希望した組み合わせが予約可能かどうかと、重なっている予約を返す
    Models.AvailableSlotResponse:
      type: object
      required:
        - staffId
        - startTime
        - endTime
      properties:
        staffId:
          allOf:
            - $ref: '#/components/schemas/Models.StaffId'
          description: 対象スタッフのID
        startTime:
          type: string
          format: date-time
          description: 空き枠の開始日時 (UTC)
        endTime:
          type: string
          format: date-time
          description: 空き枠の終了日時 (UTC)
      description: |-
        空き枠レスポンス - スタッフごとの提供可能時間帯を表し、予約可能枠の算出結果として返す。
        テーブルには保存せず、予約・スタッフのスケジュール・営業時間から算出する
    Models.BookingCancelRequest:
      type: object
      required:
        - cancellationReason
      properties:
        cancellationReason:
          type: string
          nullable: true
          description: キャンセルが発生した場合の理由。理由を記録しない場合はnull
      description: 予約キャンセルリクエスト - キャンセル理由を受け取る。キーは必須
    Models.BookingCompleteRequest:
      type: object
      required:
        - actualStartTime
        - actualEndTime
      properties:
        actualStartTime:
          type: string
          format: date-time
          nullable: true
          description: 実際の施術開始日時。記録しない場合はnull
        actualEndTime:
          type: string
          format: date-time
          nullable: true
          description: 実際の施術終了日時。actualStartTime より後の日時を指定する。記録しない場合はnull
      description: 予約完了リクエスト - 実際の施術開始・終了日時を受け取る。キーは必須で、記録しない日時は null を指定する
    Models.BookingCreateRequest:
      type: object
      required:
        - salonId
        - customerId
        - staffId
        - depositAmount
        - customerRequest
        - internalNotes
        - source
        - services
      properties:
        salonId:
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          description: 予約対象のサロンID
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: 予約を申し込む顧客ID
        staffId:
          allOf:
            - $ref: '#/components/schemas/Models.StaffId'
          description: 予約の担当スタッフのID。salonId のサロンのスタッフを指定する
        depositAmount:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: 事前に受領する内金・デポジット金額。未設定の場合はnull
        customerRequest:
          type: string
          nullable: true
          description: 顧客からの要望や特記事項。要望がない場合はnull
        internalNotes:
          type: string
          nullable: true
          description: サロン内で共有するメモ。メモがない場合はnull
        source:
          type: string
          nullable: true
          maxLength: 50
          description: '予約の受付経路（例: online、phone）。未設定の場合はnull'
        services:
          type: array
          items:
            $ref: '#/components/schemas/Models.BookingServiceCreateRequest'
          minItems: 1
          maxItems: 20
          description: 施術明細の一覧。1件以上20件以下で指定する。指定した順に sortOrder を振る
      description: |-
        予約新規作成リクエスト - 全項目のキーが必須。DB で NULL 許可のカラムのみ null を指定できる。
        作成した予約のステータスは pending になる。予約番号、日時・所要時間、金額は、システムが採番・算出する
    Models.BookingId:
      type: string
      format: uuid
      description: 予約（bookings の1行）を識別するブランド付きUUID。
    Models.BookingRequirementType:
      type: string
      enum:
        - consultation_required
        - patch_test_required
        - advance_booking_required
        - deposit_required
      description: |-
        予約要件タイプ区分 - サービス予約時に必要な条件や制約

        consultation_required: 事前カウンセリング必須 - 施術前の相談・カウンセリングが必要
        patch_test_required: パッチテスト必須 - アレルギー確認のための事前テストが必要
        advance_booking_required: 事前予約必須 - 当日予約を受け付けず、事前の予約が必要
        deposit_required: デポジット必須 - 予約時に予約金の支払いが必要
    Models.BookingRescheduleRequest:
      type: object
      required:
        - startTime
        - staffId
      properties:
        startTime:
          type: string
          format: date-time
          description: 変更後の予約開始日時 (UTC)
        staffId:
          allOf:
            - $ref: '#/components/schemas/Models.StaffId'
          description: 変更後の担当スタッフのID。予約と同じサロンのスタッフを指定する。担当を変えない場合は現在の担当スタッフのIDを指定する
      description: 予約日時変更リクエスト - 変更後の開始日時と担当スタッフを受け取る。キーは必須
    Models.BookingResponse:
      type: object
      required:
        - id
        - bookingNumber
        - salonId
        - customerId
        - staffId
        - bookingDate
        - startTime
        - endTime
        - duration
        - status
        - subtotal
        - discountAmount
        - taxAmount
        - totalAmount
        - depositAmount
        - pointsUsed
        - pointsEarned
        - customerRequest
        - internalNotes
        - reminderSent
        - reminderSentAt
        - cancelledAt
        - cancelledBy
        - cancellationReason
        - cancellationFee
        - completedAt
        - actualStartTime
        - actualEndTime
        - source
        - services
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Models.BookingId'
          description: 予約を一意に識別するID
        bookingNumber:
          type: string
          description: 予約番号。システムが採番し、すべての予約の間で一意
        salonId:
          allOf:
            - $ref: '#/components/schemas/Models.SalonId'
          description: 予約が紐づくサロンのID
        customerId:
          allOf:
            - $ref: '#/components/schemas/Models.CustomerId'
          description: 予約を行った顧客のID
        staffId:
          allOf:
            - $ref: '#/components/schemas/Models.StaffId'
          description: 予約の担当スタッフのID
        bookingDate:
          type: string
          format: date
          description: 来店日。startTime をサロンのタイムゾーンで表した日付
        startTime:
          type: string
          format: date-time
          description: 予約の開始予定日時 (UTC)。施術明細の最も早い開始日時
        endTime:
          type: string
          format: date-time
          description: 予約の終了予定日時 (UTC)。施術明細の最も遅い終了日時
        duration:
          type: integer
          format: int32
          description: 予約全体の所要時間（分）。startTime から endTime までの分数
        status:
          allOf:
            - $ref: '#/components/schemas/Models.BookingStatusType'
          description: 予約の現在ステータス
        subtotal:
          type: integer
          format: int32
          description: 小計。施術明細の料金(price)の合計
        discountAmount:
          type: integer
          format: int32
          description: 割引額の合計。施術明細の割引額と予約単位の割引を含む
        taxAmount:
          type: integer
          format: int32
          description: 消費税額
        totalAmount:
          type: integer
          format: int32
          description: 請求金額 (subtotal − discountAmount + taxAmount)
        depositAmount:
          type: integer
          format: int32
          nullable: true
          description: 事前に受領する内金・デポジット金額。未設定の場合はnull
        pointsUsed:
          type: integer
          format: int32
          nullable: true
          description: この予約の支払いで利用したポイント数。未設定の場合はnull
        pointsEarned:
          type: integer
          format: int32
          nullable: true
          description: この予約で獲得したポイント数。未設定の場合はnull
        customerRequest:
          type: string
          nullable: true
          description: 顧客からの要望や特記事項。要望がない場合はnull
        internalNotes:
          type: string
          nullable: true
          description: サロン内で共有するメモ。メモがない場合はnull
        reminderSent:
          type: boolean
          description: リマインダーを送信済みかどうか
        reminderSentAt:
          type: string
          format: date-time
          nullable: true
          description: リマインダーを送信した日時。送信していない場合はnull
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: 予約がキャンセルされた日時。キャンセルされていない場合はnull
        cancelledBy:
          type: string
          allOf:
            - $ref: '#/components/schemas/Models.UserId'
          nullable: true
          description: キャンセルを実行した利用者のID。キャンセルされていない場合、またはシステムがキャンセルした場合はnull
        cancellationReason:
          type: string
          nullable: true
          description: キャンセルが発生した場合の理由。キャンセルされていない場合、または理由が記録されていない場合はnull
        cancellationFee:
          type: integer
          format: int32
          nullable: true
          description: キャンセル料。未設定の場合はnull
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 予約の施術が完了した日時。完了していない場合はnull
        actualStartTime:
          type: string
          format: date-time
          nullable: true

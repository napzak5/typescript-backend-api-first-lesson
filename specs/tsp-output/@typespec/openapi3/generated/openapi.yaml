        active: アクティブ - 正常に利用可能なアカウント
        unverified: メール未確認 - メールアドレスが確認されていないアカウント
        inactive: 非アクティブ - 利用が休止されているアカウント
        locked: ロック - ログイン失敗回数超過によりロックされたアカウント
        suspended: 停止 - 管理者によって停止されたアカウント
        deleted: 削除済み - 削除されたアカウント

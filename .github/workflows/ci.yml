name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, Format and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check toolchain versions are in sync
        run: pnpm check:versions

      - name: Check generated API files are up to date
        run: pnpm check:generated

      - name: Check API models agree with the database schema
        run: pnpm check:api-db

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build all packages
        run: pnpm build:prod

      - name: Type check
        run: pnpm typecheck

      - name: Check for unused files, exports and dependencies
        run: pnpm knip

      - name: Upload API specification
        uses: actions/upload-artifact@v7
        with:
          name: api-spec
          path: specs/tsp-output/@typespec/openapi3/generated/openapi.yaml
          retention-days: 30

  # The packages whose unit and integration tests run: on a pull request
  # that changes nothing but the frontend, the docs and the skills, those it
  # changed and those that depend on them (pnpm's --filter "...[<base>]");
  # otherwise every package. The screen tests start the backend's test server
  # as a process of their own, which no package.json names, so a change of
  # the backend runs them all; a file at the root is no package's
  scope:
    name: Test Scope
    runs-on: ubuntu-latest
    outputs:
      filter: ${{ steps.scope.outputs.filter }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge commit of a pull request and its first parent, the base
          fetch-depth: 2

      - name: Choose the packages
        id: scope
        run: |
          outside='^(frontend|docs|\.claude)/|\.md$'
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "Every package: a push"
            echo "filter=" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qvE "$outside"; then
            echo "Every package: the pull request changes these files"
            git diff --name-only HEAD^1 HEAD | grep -vE "$outside"
            echo "filter=" >> "$GITHUB_OUTPUT"
          else
            base=$(git rev-parse HEAD^1)
            echo "The packages changed since $base, and those that depend on them"
            echo "filter=--filter=...[$base]" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit Test
    needs: scope
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge commit of a pull request and its first parent, the base
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build:prod

      - name: Run unit tests
        run: pnpm -r ${{ needs.scope.outputs.filter }} run test

  test:
    name: Test (${{ matrix.database }} database, part ${{ matrix.part }} of 4)
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # external: the PostgreSQL service below, through TEST_DATABASE_URL
        # testcontainers: a container started by the test setup itself
        database: [external, testcontainers]
        # The test files of every package are cut into four parts (Vitest's
        # --shard), each run by a job of its own
        part: [1, 2, 3, 4]
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/beauty_salon_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beauty_salon_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge commit of a pull request and its first parent, the base
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build:prod

      - name: Run integration tests
        # pnpm test:integration, for the packages of the scope. A package with
        # fewer test files than parts has parts without any
        run: pnpm -r --no-sort ${{ needs.scope.outputs.filter }} run test:integration --shard=${{ matrix.part }}/4 --passWithNoTests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'external' && 'postgres://postgres:postgres@localhost:5432/beauty_salon_test' || '' }}

      - name: Check the database schema files are up to date
        if: matrix.database == 'external' && matrix.part == 1
        run: pnpm check:db-schema

  # A browser on the built applications, the production API and PostgreSQL.
  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    env:
      CI: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beauty_salon_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser and what it needs of the system
        run: pnpm --filter @beauty-salon-frontend/e2e exec playwright install --with-deps --only-shell chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/beauty_salon_test

      # What the browser did in the tests that failed: `playwright show-trace`
      - name: Upload the report and the traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, test, stg, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for ${{ matrix.environment }}
        run: pnpm build:${{ matrix.environment }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.environment }}
          path: |
            backend/packages/*/dist
            backend/apps/*/dist
            frontend/apps/*/dist
          retention-days: 7

  # The images are published only for a commit on main whose checks passed.
  publish-staging-images:
    name: Publish Staging Images
    needs: [quality, unit, test, e2e, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      environment: staging

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high

name: Docker Build Validation

on:
  pull_request:
    paths:
      - 'Dockerfile.*'
      - '.dockerignore'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'backend/**'
      - 'frontend/**'
      - 'specs/**'
      - 'shared-config/**'
      - '.github/workflows/docker-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dockerfiles:
    name: Validate Dockerfile Builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            file: Dockerfile.backend
            target: production
            build-args: ''
          - name: frontend-admin
            file: Dockerfile.frontend
            target: runtime
            port: 4001
            app: admin
            mode: production
            build-args: |
              APP=admin
              APP_PORT=4001
          - name: frontend-portal
            file: Dockerfile.frontend
            target: runtime
            port: 4002
            app: portal
            mode: production
            build-args: |
              APP=portal
              APP_PORT=4002
          - name: frontend-dashboard
            file: Dockerfile.frontend
            target: runtime
            port: 4003
            app: dashboard
            mode: production
            build-args: |
              APP=dashboard
              APP_PORT=4003
          # What CI publishes for staging: the same Dockerfile with BUILD_SCRIPT.
          - name: frontend-admin-staging
            file: Dockerfile.frontend
            target: runtime
            port: 4001
            app: admin
            mode: staging
            build-args: |
              APP=admin
              APP_PORT=4001
              BUILD_SCRIPT=build:stg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lint ${{ matrix.image.file }}
        run: docker run --rm -i hadolint/hadolint < ${{ matrix.image.file }} || true

      - name: Build ${{ matrix.image.name }} (${{ matrix.image.target }} stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          push: false
          load: true
          tags: test-${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-validation
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-validation
          build-args: ${{ matrix.image.build-args }}

      - name: Verify backend image contents
        if: matrix.image.name == 'backend'
        run: |
          docker run --rm test-${{ matrix.image.name }}:${{ github.sha }} sh -c '
            node --version &&
            test -f backend/apps/server/dist/index.js &&
            test -f backend/packages/api/dist/index.js
          '

      # The image holds no .env file: the container is configured by its
      # environment alone, starts only when the database answers, and a
      # graceful shutdown ends with status 0.
      - name: Smoke test backend container
        if: matrix.image.name == 'backend'
        run: |
          docker network create smoke
          docker run --rm -d --name smoke-db --network smoke \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=beauty_salon postgres:18-alpine
          for _ in $(seq 1 30); do
            if docker exec smoke-db pg_isready --host 127.0.0.1 --username postgres --quiet; then
              break
            fi
            sleep 1
          done
          docker run -d --name smoke --network smoke -p 3000:3000 --env-file .env.test.ci \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://postgres:postgres@smoke-db:5432/beauty_salon \
            test-${{ matrix.image.name }}:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "http://localhost:3000/api/system/ready"; then
              echo "✅ backend is ready on port 3000"
              docker stop smoke
              exit_code=$(docker inspect smoke --format '{{.State.ExitCode}}')
              echo "backend stopped with status $exit_code"
              docker logs smoke
              test "$exit_code" = "0"
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      # A bundle is built for one environment. The application title is a
      # VITE_* value that every app renders, so the bundle must contain the
      # title of its environment as a whole string literal.
      - name: Verify the environment of the ${{ matrix.image.name }} bundle
        if: matrix.image.name != 'backend'
        run: |
          title=$(grep '^VITE_APP_TITLE=' "frontend/apps/${{ matrix.image.app }}-app/.env.${{ matrix.image.mode }}" | cut -d= -f2-)
          test -n "$title"
          for quote in '`' '"' "'"; do
            if docker run --rm test-${{ matrix.image.name }}:${{ github.sha }} grep -rqF "${quote}${title}${quote}" dist; then
              echo "✅ the bundle shows ${quote}${title}${quote} (${{ matrix.image.mode }})"
              exit 0
            fi
          done
          echo "❌ the bundle does not contain the title of ${{ matrix.image.mode }}: ${title}"
          exit 1

      - name: Smoke test ${{ matrix.image.name }} container
        if: matrix.image.name != 'backend'
        run: |
          docker run --rm -d --name smoke -p ${{ matrix.image.port }}:${{ matrix.image.port }} test-${{ matrix.image.name }}:${{ github.sha }}
          for _ in $(seq 1 20); do
            if curl --fail --silent --output /dev/null "http://localhost:${{ matrix.image.port }}/"; then
              echo "✅ ${{ matrix.image.name }} is serving on port ${{ matrix.image.port }}"
              docker stop smoke
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          docker stop smoke
          exit 1

  all-dockerfiles-valid:
    name: All Dockerfile Builds Valid
    runs-on: ubuntu-latest
    needs: validate-dockerfiles
    if: always()
    steps:
      - name: Check all builds passed
        run: |
          if [[ "${{ needs.validate-dockerfiles.result }}" == "success" ]]; then
            echo "✅ All Dockerfile builds validated successfully!"
            exit 0
          else
            echo "❌ One or more Dockerfile builds failed validation"
            echo "Please check the build logs above for details"
            exit 1
          fi
